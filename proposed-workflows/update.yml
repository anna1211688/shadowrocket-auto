name: Update Shadowrocket Subscription

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/quality_report.json'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# 顶层只给只读；只有 publish job 单独申请 contents: write。
# collect job 处理不可信的订阅/节点数据，全程拿不到可写令牌：
# checkout 关闭凭据持久化 (persist-credentials: false)，Collect
# 步骤的环境里也不注入任何令牌；publish job 只做 git 发布，
# 并在步骤里用 GH_TOKEN 显式拼 extraheader 完成推送。
permissions:
  contents: read

concurrency:
  group: update-subscription
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Cache pinned sing-box
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bin/sing-box
          key: sing-box-1.14.4-linux-amd64-699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968
      - name: Install pinned sing-box for real proxy speed tests
        env:
          SING_BOX_VERSION: '1.14.4'
          SING_BOX_SHA256: '699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968'
        run: |
          if [ -x "$RUNNER_TEMP/bin/sing-box" ]; then
            echo "sing-box restored from cache"
          else
            archive="$RUNNER_TEMP/sing-box.tar.gz"
            url="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
            curl --fail --location --silent --show-error --retry 2 "$url" -o "$archive"
            echo "${SING_BOX_SHA256}  ${archive}" | sha256sum --check -
            mkdir -p "$RUNNER_TEMP/sing-box-extract" "$RUNNER_TEMP/bin"
            tar -xzf "$archive" -C "$RUNNER_TEMP/sing-box-extract"
            binary="$(find "$RUNNER_TEMP/sing-box-extract" -type f -name sing-box -print -quit)"
            test -n "$binary"
            install -m 0755 "$binary" "$RUNNER_TEMP/bin/sing-box"
          fi
          echo "SING_BOX_PATH=$RUNNER_TEMP/bin/sing-box" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/bin/sing-box" version
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Collect nodes
        # 不注入 GITHUB_TOKEN/GH_TOKEN：发现层只读环境变量令牌，
        # 无令牌时自动降级为未授权速率的仓库搜索。
        run: python scripts/collector.py
      - name: Upload generated docs for publish job
        uses: actions/upload-artifact@v4
        with:
          name: generated-docs
          path: |
            docs/shadowrocket.txt
            docs/clash.yaml
            docs/quality_report.json
          if-no-files-found: warn
          retention-days: 1

  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download generated docs
        uses: actions/download-artifact@v4
        with:
          name: generated-docs
          path: docs
      - name: Publish public subscriptions to gh-pages
        if: success() && hashFiles('docs/shadowrocket.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_dir="$RUNNER_TEMP/shadowrocket-pages"
          mkdir -p "$pages_dir"
          cp docs/shadowrocket.txt "$pages_dir/shadowrocket.txt"
          if [ -f docs/clash.yaml ]; then
            cp docs/clash.yaml "$pages_dir/clash.yaml"
          fi
          touch "$pages_dir/.nojekyll"
          git -C "$pages_dir" init --initial-branch=gh-pages
          git -C "$pages_dir" config user.name 'github-actions[bot]'
          git -C "$pages_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$pages_dir" add -- shadowrocket.txt .nojekyll
          if [ -f "$pages_dir/clash.yaml" ]; then
            git -C "$pages_dir" add -- clash.yaml
          fi
          git -C "$pages_dir" commit -m "Publish latest subscriptions"
          git -C "$pages_dir" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C "$pages_dir" -c http.extraheader="$auth_header" push --force origin HEAD:gh-pages
          echo 'Published subscription files to gh-pages (shadowrocket.txt, clash.yaml if generated)'

      - name: Save generated public artifacts only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # 报告每轮整份重生成，写回时不走 rebase：先把本轮报告留一份，
          # 将工作区对齐到远端最新 main，再把报告放回重新提交推送。
          # 旧写法 rebase 到最新 main 时，若触发后已有另一轮运行推过
          # 报告提交，两边同改 quality_report.json 必然冲突并 exit 1，
          # 整轮报告丢失（2026-11-24 的 #346、#349）。推送本身失败
          # 仍按 3 次重试（每轮都重新对齐最新 main）。
          report_copy="$RUNNER_TEMP/quality_report.json"
          if [ ! -f docs/quality_report.json ]; then
            echo 'No quality report generated in this run'
            exit 0
          fi
          cp docs/quality_report.json "$report_copy"
          for attempt in 1 2 3; do
            git -c http.extraheader="$auth_header" fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            cp "$report_copy" docs/quality_report.json
            git add -- docs/quality_report.json
            if git diff --cached --quiet; then
              echo 'No public artifact changes'
              break
            fi
            git commit -m "Update aggregate quality report"
            if git -c http.extraheader="$auth_header" push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Report pushed (attempt $attempt)"
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo 'Report push failed after 3 attempts' >&2
              exit 1
            fi
            sleep 5
          done

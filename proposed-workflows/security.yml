name: Security audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Compile check
        run: python -m py_compile scripts/collector.py scripts/discovery.py scripts/speedtest.py
      - name: Install locked dependencies and pip-audit
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install pip-audit
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --requirement requirements.txt --strict

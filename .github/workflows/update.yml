name: Update Shadowrocket Subscription

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-subscription
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Collect nodes
        run: python scripts/collector.py
      - name: Validate generated public subscription artifact
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          path = Path('docs/shadowrocket.txt')
          if not path.exists():
              print('No subscription artifact exists yet; collector preserved the empty state.')
              raise SystemExit(0)
          raw = path.read_text(encoding='ascii').strip()
          if not raw or len(raw) > 2_000_000:
              raise SystemExit('Subscription artifact is empty or exceeds the publication size limit')
          try:
              decoded = base64.b64decode(raw, validate=True).decode('utf-8')
          except (ValueError, UnicodeDecodeError) as exc:
              raise SystemExit('Subscription artifact is not valid Base64 UTF-8') from exc
          lines = [line.strip() for line in decoded.splitlines() if line.strip()]
          allowed = ('ss://', 'vmess://', 'vless://', 'trojan://', 'hysteria://', 'hysteria2://', 'hy2://', 'tuic://')
          if not lines or len(lines) > 150 or any(not line.lower().startswith(allowed) for line in lines):
              raise SystemExit('Subscription artifact failed node-count or URI-scheme validation')
          if Path('docs/shadowrocket_plain.txt').exists():
              raise SystemExit('Plaintext subscription artifact must not be published')
          print(f'Validated {len(lines)} encoded subscription entries')
          PY
      - name: Save generated public artifacts only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/shadowrocket.txt docs/quality_report.json
          if ! git diff --cached --quiet; then
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo 'No public artifact changes'
          fi

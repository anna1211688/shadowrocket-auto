name: Update Shadowrocket Subscription

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-subscription
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect and test nodes
        id: collect
        run: |
          python scripts/collector.py
          # 提取最终节点数用于 commit message
          if [ -f docs/shadowrocket_plain.txt ]; then
            count=$(wc -l < docs/shadowrocket_plain.txt | tr -d ' ')
            echo "node_count=$count" >> $GITHUB_OUTPUT
          else
            echo "node_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Save subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            count="${{ steps.collect.outputs.node_count }}"
            git commit -m "Update subscription: ${count} nodes"
            git push
          else
            echo "No changes to commit"
          fi

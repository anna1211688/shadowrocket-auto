name: Update Shadowrocket Subscription

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-subscription
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Install pinned sing-box for real proxy speed tests
        env:
          SING_BOX_VERSION: '1.14.4'
          SING_BOX_SHA256: '699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968'
        run: |
          archive="$RUNNER_TEMP/sing-box.tar.gz"
          url="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 2 "$url" -o "$archive"
          echo "${SING_BOX_SHA256}  ${archive}" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/sing-box-extract" "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/sing-box-extract"
          binary="$(find "$RUNNER_TEMP/sing-box-extract" -type f -name sing-box -print -quit)"
          test -n "$binary"
          install -m 0755 "$binary" "$RUNNER_TEMP/bin/sing-box"
          echo "SING_BOX_PATH=$RUNNER_TEMP/bin/sing-box" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/bin/sing-box" version
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Collect nodes
        run: python scripts/collector.py
      - name: Save generated public artifacts only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/quality_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Update aggregate quality report"
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo 'No public artifact changes'
          fi
